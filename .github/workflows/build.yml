name: Build Husk iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      
      - name: 安裝依賴工具
        run: |
          brew install pkg-config meson ninja glib qemu cmake 2>/dev/null || true
          python3 -m pip install --break-system-packages pyyaml 2>/dev/null || pip3 install pyyaml
      
      - name: 安裝 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      
      - name: Fetch sources
        run: ./scripts/fetch_sources.sh
      
      - name: 構建基礎依賴
        run: ./scripts/build_ios.sh libffi glib pixman libucontext libslirp
      
      - name: 準備 cross 文件
        run: cp build/ios-arm64/cross-darwin.meson build/ios-arm64/cross-ios-darwin.meson
      
      - name: 構建 ANGLE
        run: |
          if [ ! -f build/ios-arm64/sysroot/lib/libANGLE-shared.dylib ]; then
            ./scripts/build_angle_ios.sh
          fi
      
      - name: 構建 GPU (virglrenderer)
        run: |
          if [ ! -f build/ios-arm64/sysroot/lib/libvirglrenderer.a ]; then
            PKG_CONFIG_LIBDIR="$PWD/build/ios-arm64/sysroot/lib/pkgconfig:$PWD/build/ios-arm64/sysroot/share/pkgconfig" \
              ./scripts/build_gpu_ios.sh
          fi
      
      - name: 構建 QEMU
        run: ./scripts/build_ios.sh qemu
      
      - name: 集成 Husk 補丁並重編
        run: |
          ./scripts/integrate_husk.sh
          ./scripts/build_ios.sh qemurebuild
      
      - name: 下載 Guest 鏡像
        run: ./scripts/fetch_phase0_guest.sh
      
      - name: 構建 java-runtime（翻譯層）
        run: |
          set -e
          mkdir -p build
          cd build
          IMG=vda-v12.qcow2
          if [ ! -f "$IMG" ]; then
            echo "下載 Android 鏡像..."
            curl -fL --retry 3 -o "$IMG" \
              https://github.com/Leviidev/Husk/releases/download/lineage-v2/vda-v12.qcow2
          fi
          cd ..
          brew install e2fsprogs 2>/dev/null || true
          # 安裝 JDK（build.sh 需要 javac）
          echo "安裝 OpenJDK..."
          brew install --cask temurin 2>/dev/null || brew install openjdk 2>/dev/null || true
          export JAVA_HOME=$(/usr/libexec/java_home 2>/dev/null || echo "/opt/homebrew/opt/openjdk")
          export HUSK_JDK="$JAVA_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/javac" -version || echo "WARN: javac 不可用"
          # 下載 R8（D8 dexer）
          if [ ! -f build/r8.jar ]; then
            echo "下載 R8..."
            # R8 8.5+ 版本，build.sh 要求 8.5+（build-tools 34 的 d8 會崩）
            curl -fL --retry 3 -o build/r8.jar \
              https://storage.googleapis.com/r8-releases/raw/8.5.35/r8-8.5.35.jar || \
            echo "WARN: R8 下載失敗，dex 生成可能跳過"
          fi
          export HUSK_D8="$PWD/build/r8.jar"
          chmod +x scripts/extract_apex_for_java_runtime.sh
          ./scripts/extract_apex_for_java_runtime.sh build/vda-v12.qcow2 build/apex
          HTTP_LEGACY=build/apex/framework/org.apache.http.legacy.jar \
          FRAMEWORK_RES=build/apex/framework/framework-res.apk \
          ./scripts/build_java_runtime.sh build/apex || echo "WARN: java-runtime 部分失敗，繼續構建"
          echo "java-runtime 構建完成:"
          du -sh build/java-runtime || true
      
      - name: 構建 MoltenVK
        run: |
          if [ ! -d build/ios-arm64/lib/MoltenVK.xcframework ]; then
            ./scripts/build_moltenvk_ios.sh
          fi
      
      - name: 構建 Rust pairing
        run: ./scripts/build_rppairing_ios.sh
      
      - name: 清理 Xcode 緩存
        run: |
          xcodebuild -project src/app/Husk.xcodeproj -scheme Husk clean || true
      
      - name: 安裝 xcodegen
        run: brew install xcodegen
        
      - name: 生成 Xcode 工程
        run: xcodegen generate
      
      - name: 打包 IPA
        run: |
          mkdir -p build
          ./scripts/package_ipa.sh build/Husk.ipa
          ls -lh build/Husk.ipa
      
      - name: 上傳 IPA
        uses: actions/upload-artifact@v4
        with:
          name: husk-ipa
          path: build/Husk.ipa
      
      - name: 打包 java-runtime
        if: always()
        run: |
          cd build
          zip -r -y java-runtime.zip java-runtime || echo "WARN: java-runtime 打包失敗"
          ls -lh java-runtime.zip || true
      
      - name: 上傳 java-runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-runtime
          path: build/java-runtime.zip
          retention-days: 7
      
      - name: 上傳日誌
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/logs/
          retention-days: 7
