name: Build Husk-iOS15

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 安裝 xcodegen
        run: brew install xcodegen
        
      - name: 生成 Xcode 工程
        run: xcodegen generate
        
      - name: 構建 App
        run: |
          xcodebuild -project Husk-iOS15.xcodeproj \
            -scheme Husk-iOS15 \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
      - name: 打包 IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Husk-iOS15.app Payload/
          zip -r Husk-iOS15.ipa Payload/
          
      - name: 上傳 IPA
        uses: actions/upload-artifact@v4
        with:
          name: husk-ios15-ipa
          path: Husk-iOS15.ipa
